<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books &amp; Blooms — Developer Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:        #080a0f;
            --bg-card:   #0f1219;
            --bg-panel:  #141820;
            --border:    #1e2537;
            --border-hi: #2d3a54;

            --gold:      #c9a961;
            --gold-dim:  #8a7040;
            --gold-glow: rgba(201,169,97,.22);
            --gold-glow2:rgba(201,169,97,.10);

            --cyan:      #38bdf8;
            --emerald:   #34d399;
            --rose:      #f87171;
            --amber:     #fbbf24;

            --text:      #e8eaf0;
            --muted:     #64748b;
            --dim:       #3b4563;

            --mono:      'JetBrains Mono', monospace;
            --sans:      'DM Sans', sans-serif;
            --serif:     'Cormorant Garamond', serif;

            --radius:    12px;
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            font-family: var(--sans);
            background: var(--bg);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            overflow-x: hidden;
            overflow-y: auto;
            position: relative;
            box-sizing: border-box;
        }

        /* ── Animated background mesh ── */
        .bg-mesh {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(ellipse 60% 50% at 20% 30%,  rgba(201,169,97,.07) 0%, transparent 70%),
                radial-gradient(ellipse 50% 40% at 80% 70%,  rgba(56,189,248,.06) 0%, transparent 70%),
                radial-gradient(ellipse 80% 80% at 50% 50%,  rgba(8,10,15,1) 0%,  rgba(14,18,28,1) 100%);
            animation: meshPulse 8s ease-in-out infinite alternate;
        }

        @keyframes meshPulse {
            from { opacity: .8; }
            to   { opacity: 1; }
        }

        /* ── Floating grid lines ── */
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(201,169,97,.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(201,169,97,.04) 1px, transparent 1px);
            background-size: 48px 48px;
            mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 30%, transparent 100%);
        }

        /* ── Corner accent lines ── */
        .corner {
            position: fixed;
            width: 60px; height: 60px;
            z-index: 1;
            opacity: .35;
            pointer-events: none;
        }
        .corner::before, .corner::after {
            content: '';
            position: absolute;
            background: var(--gold-dim);
        }
        .corner.tl { top:20px; left:20px; }
        .corner.tr { top:20px; right:20px; }
        .corner.bl { bottom:20px; left:20px; }
        .corner.br { bottom:20px; right:20px; }

        .corner.tl::before { width:1px; height:30px; top:0; left:0; }
        .corner.tl::after  { width:30px; height:1px; top:0; left:0; }
        .corner.tr::before { width:1px; height:30px; top:0; right:0; }
        .corner.tr::after  { width:30px; height:1px; top:0; right:0; }
        .corner.bl::before { width:1px; height:30px; bottom:0; left:0; }
        .corner.bl::after  { width:30px; height:1px; bottom:0; left:0; }
        .corner.br::before { width:1px; height:30px; bottom:0; right:0; }
        .corner.br::after  { width:30px; height:1px; bottom:0; right:0; }

        /* ── Main card ── */
        .card {
            position: relative;
            z-index: 10;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 30px 26px 22px;
            width: 100%;
            max-width: 360px;
            margin: auto;
            box-shadow:
                0 0 0 1px rgba(201,169,97,.06),
                0 30px 60px rgba(0,0,0,.65),
                0 0 50px rgba(201,169,97,.03) inset;
            animation: cardIn .45s cubic-bezier(.22,1,.36,1) both;
        }

        @keyframes cardIn {
            from { opacity:0; transform:translateY(16px) scale(.98); }
            to   { opacity:1; transform:none; }
        }

        /* gold top bar */
        .card::before {
            content:'';
            position: absolute;
            top: 0; left: 30px; right: 30px; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            opacity: .7;
            border-radius: 1px;
        }

        /* ── Brand header ── */
        .brand {
            text-align: center;
            margin-bottom: 18px;
        }

        .brand-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            border: 1px solid var(--border-hi);
            background: linear-gradient(135deg, var(--bg-panel), var(--bg-card));
            display: flex; align-items:center; justify-content:center;
            margin: 0 auto 10px;
            font-size: 1.25rem;
            box-shadow: 0 0 18px var(--gold-glow2);
        }

        .brand-name {
            font-family: var(--serif);
            font-size: 1.35rem;
            color: var(--text);
            letter-spacing: .5px;
            margin-bottom: 3px;
            line-height: 1.2;
        }

        .brand-name em {
            font-style: italic;
            color: var(--gold);
        }

        .brand-sub {
            font-family: var(--mono);
            font-size: .65rem;
            letter-spacing: 2.2px;
            text-transform: uppercase;
            color: var(--muted);
        }

        /* ── Divider ── */
        .divider {
            display: flex; align-items:center; gap:10px;
            margin-bottom: 16px;
        }
        .divider-line { flex:1; height:1px; background:var(--border); }
        .divider-label {
            font-family: var(--mono);
            font-size: .62rem;
            letter-spacing: 1.8px;
            text-transform: uppercase;
            color: var(--dim);
        }

        /* ── PIN dots display ── */
        .pin-display {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .pin-dot {
            width: 14px; height: 14px;
            border-radius: 50%;
            border: 2px solid var(--dim);
            background: transparent;
            transition: all .2s ease;
        }

        .pin-dot.filled {
            background: var(--gold);
            border-color: var(--gold);
            box-shadow: 0 0 10px var(--gold-glow);
            animation: dotPop .15s ease;
        }

        .pin-dot.error {
            border-color: var(--rose);
            background: var(--rose);
            box-shadow: 0 0 10px rgba(248,113,113,.3);
        }

        @keyframes dotPop {
            0%   { transform:scale(.6); }
            60%  { transform:scale(1.15); }
            100% { transform:scale(1); }
        }

        /* ── Keypad ── */
        .keypad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 14px;
        }

        .key {
            height: 50px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg-panel);
            color: var(--text);
            font-family: var(--mono);
            font-size: 1.15rem;
            font-weight: 500;
            cursor: pointer;
            transition: all .15s ease;
            display: flex; align-items:center; justify-content:center;
            user-select: none;
            position: relative;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .key::after {
            content:'';
            position:absolute;
            inset:0;
            background: radial-gradient(circle at center, rgba(201,169,97,.15), transparent 70%);
            opacity:0;
            transition: opacity .2s;
        }

        .key:hover {
            border-color: var(--border-hi);
            background: #1a2030;
            transform: translateY(-1px);
            box-shadow: 0 4px 14px rgba(0,0,0,.3);
        }

        .key:hover::after { opacity:1; }

        .key:active {
            transform: scale(.95);
            background: #1e2840;
            border-color: var(--gold-dim);
            box-shadow: 0 0 10px var(--gold-glow);
        }

        .key.key-zero { grid-column: 2; }

        .key.key-del {
            color: var(--muted);
            font-size: .95rem;
        }

        .key.key-del:hover { color: var(--rose); border-color: rgba(248,113,113,.3); }

        /* ── Submit button ── */
        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #b8923a, var(--gold), #d4b06a);
            background-size: 200% 200%;
            background-position: 0% 50%;
            border: none;
            border-radius: 10px;
            color: #0c0e12;
            font-family: var(--mono);
            font-size: .82rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all .25s ease;
            box-shadow: 0 4px 18px rgba(201,169,97,.2);
            margin-bottom: 10px;
        }

        .btn-submit:hover {
            background-position: 100% 50%;
            box-shadow: 0 6px 24px rgba(201,169,97,.35);
            transform: translateY(-1px);
        }

        .btn-submit:active { transform:scale(.98); }
        .btn-submit:disabled { opacity:.35; cursor:not-allowed; transform:none; }

        /* ── Error message ── */
        .error-box {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(248,113,113,.08);
            border: 1px solid rgba(248,113,113,.25);
            border-radius: 10px;
            padding: 10px 12px;
            margin-bottom: 14px;
            animation: shakeIn .4s ease;
        }

        @keyframes shakeIn {
            0%  { transform:translateX(-6px); }
            25% { transform:translateX(6px); }
            50% { transform:translateX(-4px); }
            75% { transform:translateX(4px); }
            100%{ transform:translateX(0); }
        }

        .error-icon { font-size:.95rem; flex-shrink:0; }

        .error-text {
            font-size: .8rem;
            color: var(--rose);
            line-height: 1.4;
        }

        /* ── Footer note ── */
        .footer-note {
            text-align: center;
            font-family: var(--mono);
            font-size: .6rem;
            letter-spacing: 1.3px;
            text-transform: uppercase;
            color: var(--dim);
        }

        /* ── Hidden digit inputs (submitted via form) ── */
        .hidden-inputs { display:none; }

        /* ── Shake animation for wrong PIN ── */
        .shake {
            animation: cardShake .4s ease;
        }
        @keyframes cardShake {
            0%  { transform:translateX(0); }
            20% { transform:translateX(-8px); }
            40% { transform:translateX(8px); }
            60% { transform:translateX(-5px); }
            80% { transform:translateX(5px); }
            100%{ transform:translateX(0); }
        }

        /* ── Responsive: Mobile Devices (<= 480px width) ── */
        @media (max-width: 480px) {
            body {
                padding: 16px 12px;
            }
            .corner {
                display: none;
            }
            .card {
                max-width: 100%;
                padding: 24px 18px 18px;
                border-radius: 16px;
            }
            .card::before {
                left: 20px; right: 20px;
            }
            .brand {
                margin-bottom: 14px;
            }
            .brand-icon {
                width: 40px; height: 40px;
                font-size: 1.15rem;
                margin-bottom: 8px;
            }
            .brand-name {
                font-size: 1.25rem;
            }
            .divider {
                margin-bottom: 14px;
            }
            .pin-display {
                margin-bottom: 16px;
                gap: 10px;
            }
            .pin-dot {
                width: 12px; height: 12px;
            }
            .keypad {
                gap: 7px;
                margin-bottom: 12px;
            }
            .key {
                height: 46px;
                font-size: 1.1rem;
            }
            .btn-submit {
                padding: 11px;
                font-size: .78rem;
                margin-bottom: 8px;
            }
        }

        /* ── Responsive: Compact Viewport Height (<= 680px height) ── */
        @media (max-height: 680px) {
            body {
                padding: 10px 12px;
            }
            .corner {
                display: none;
            }
            .card {
                padding: 18px 20px 14px;
            }
            .brand {
                margin-bottom: 10px;
            }
            .brand-icon {
                width: 34px; height: 34px;
                font-size: 1rem;
                margin-bottom: 5px;
            }
            .brand-name {
                font-size: 1.15rem;
                margin-bottom: 2px;
            }
            .brand-sub {
                font-size: .58rem;
                letter-spacing: 1.5px;
            }
            .divider {
                margin-bottom: 10px;
            }
            .pin-display {
                margin-bottom: 12px;
                gap: 8px;
            }
            .pin-dot {
                width: 11px; height: 11px;
            }
            .keypad {
                gap: 6px;
                margin-bottom: 8px;
            }
            .key {
                height: 40px;
                font-size: 1rem;
            }
            .btn-submit {
                padding: 9px;
                font-size: .72rem;
                margin-bottom: 6px;
            }
            .footer-note {
                font-size: .54rem;
            }
        }
    </style>
</head>
<body data-has-error="{{ '1' if error else '0' }}">

<!-- Animated background -->
<div class="bg-mesh"></div>
<div class="bg-grid"></div>

<!-- Corner accents -->
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<!-- PIN Card -->
<div class="card" id="pinCard">

    <!-- Brand -->
    <div class="brand">
        <div class="brand-icon">⚡</div>
        <div class="brand-name">Books <em>&amp;</em> Blooms</div>
        <div class="brand-sub">Developer Console</div>
    </div>

    <!-- Divider -->
    <div class="divider">
        <div class="divider-line"></div>
        <span class="divider-label">Enter 6-digit PIN</span>
        <div class="divider-line"></div>
    </div>

    <!-- Error (if any) -->
    {% if error %}
    <div class="error-box" id="errorBox">
        <span class="error-icon">🔒</span>
        <span class="error-text">{{ error }}</span>
    </div>
    {% endif %}

    <!-- PIN dot display -->
    <div class="pin-display" id="pinDisplay">
        <div class="pin-dot {% if error %}error{% endif %}" id="dot1"></div>
        <div class="pin-dot {% if error %}error{% endif %}" id="dot2"></div>
        <div class="pin-dot {% if error %}error{% endif %}" id="dot3"></div>
        <div class="pin-dot {% if error %}error{% endif %}" id="dot4"></div>
        <div class="pin-dot {% if error %}error{% endif %}" id="dot5"></div>
        <div class="pin-dot {% if error %}error{% endif %}" id="dot6"></div>
    </div>

    <!-- Keypad form -->
    <form method="POST" action="{{ url_for('developer.dev_login') }}" id="pinForm">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <!-- Hidden actual digit fields -->
        <div class="hidden-inputs">
            <input type="text" name="d1" id="d1" maxlength="1">
            <input type="text" name="d2" id="d2" maxlength="1">
            <input type="text" name="d3" id="d3" maxlength="1">
            <input type="text" name="d4" id="d4" maxlength="1">
            <input type="text" name="d5" id="d5" maxlength="1">
            <input type="text" name="d6" id="d6" maxlength="1">
        </div>

        <!-- Number keypad -->
        <div class="keypad">
            <button type="button" class="key" onclick="pressKey('1')">1</button>
            <button type="button" class="key" onclick="pressKey('2')">2</button>
            <button type="button" class="key" onclick="pressKey('3')">3</button>
            <button type="button" class="key" onclick="pressKey('4')">4</button>
            <button type="button" class="key" onclick="pressKey('5')">5</button>
            <button type="button" class="key" onclick="pressKey('6')">6</button>
            <button type="button" class="key" onclick="pressKey('7')">7</button>
            <button type="button" class="key" onclick="pressKey('8')">8</button>
            <button type="button" class="key" onclick="pressKey('9')">9</button>
            <button type="button" class="key key-zero" onclick="pressKey('0')">0</button>
            <button type="button" class="key key-del" onclick="deleteKey()">⌫</button>
        </div>

        <!-- Submit -->
        <button type="submit" class="btn-submit" id="submitBtn" disabled>UNLOCK</button>
    </form>

    <div class="footer-note">Restricted Access &mdash; Authorised Personnel Only</div>

</div>

<script>
    let pin = [];
    const MAX = 6;

    function updateDisplay() {
        for (let i = 1; i <= MAX; i++) {
            const dot = document.getElementById('dot' + i);
            dot.classList.remove('error');
            if (i <= pin.length) {
                dot.classList.add('filled');
            } else {
                dot.classList.remove('filled');
            }
        }
        // Sync hidden inputs
        for (let i = 1; i <= MAX; i++) {
            document.getElementById('d' + i).value = pin[i - 1] || '';
        }
        // Enable submit when 6 digits entered
        document.getElementById('submitBtn').disabled = pin.length < MAX;
    }

    function pressKey(digit) {
        if (pin.length >= MAX) return;
        pin.push(digit);
        updateDisplay();

        // Auto-submit when 6 digits entered
        if (pin.length === MAX) {
            setTimeout(() => {
                document.getElementById('pinForm').submit();
            }, 120);
        }
    }

    function deleteKey() {
        if (pin.length === 0) return;
        pin.pop();
        updateDisplay();
    }

    // Physical keyboard support
    document.addEventListener('keydown', function(e) {
        if (e.key >= '0' && e.key <= '9') {
            pressKey(e.key);
        } else if (e.key === 'Backspace' || e.key === 'Delete') {
            deleteKey();
        }
    });

    // Clear error dots on first keypress after error (reads data-has-error attr, no Jinja in script)
    if (document.body.dataset.hasError === '1') {
        let firstKey = true;
        const originalPressKey = pressKey;
        window.pressKey = function(digit) {
            if (firstKey) {
                document.querySelectorAll('.pin-dot').forEach(function(d) { d.classList.remove('error'); });
                firstKey = false;
            }
            originalPressKey(digit);
        };
    }
</script>

</body>
</html>
