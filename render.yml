services:
  - type: web
    name: code-crew
    env: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -c gunicorn.conf.py --bind 0.0.0.0:10000
    healthCheckPath: /ping
    envVars:
      - key: FLASK_SECRET_KEY
        sync: false
      - key: AES_SECRET_KEY
        sync: false
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        value: "3306"
      - key: MYSQL_USER
        sync: false
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DB
        sync: false
      - key: MYSQL_SSL_CA
        sync: false
      - key: GMAIL_SENDER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: ADMIN_SETUP_TOKEN
        sync: false
      - key: BREVO_API_KEY
        sync: false